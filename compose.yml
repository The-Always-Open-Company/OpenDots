services:
  app:
    build:
      context: .
      target: app
    ports:
      - '127.0.0.1:4310:4310'
    environment:
      OWNER_TOKEN: ${OWNER_TOKEN:?Set a 24+ character OWNER_TOKEN in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4310}
      OWNER_ID: ${OWNER_ID:-opendots-owner}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      VOICE_MODEL: ${VOICE_MODEL:-}
      VOICE_NAME: ${VOICE_NAME:-marin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-}
      CONTEXT_MAX_TOKENS: ${CONTEXT_MAX_TOKENS:-}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-parallel}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      BROWSER_URL: http://browser:4311
      BROWSER_SECRET: ${BROWSER_SECRET:-}
      DATABASE_URL: postgres://opendots:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/opendots
      DOCLING_URL: http://docling:5001
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      MEMORY_MODEL: ${MEMORY_MODEL:-}
      ENRICHMENT_MODEL: ${ENRICHMENT_MODEL:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      DOCUMENTS_DIR: /data/documents
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
    volumes:
      - opendots-data:/data
    depends_on:
      - postgres
      - docling
    networks:
      - browser-link
      - data-link
      - app-egress
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  browser:
    profiles: [browser]
    build:
      context: .
      target: browser
    environment:
      BROWSER_SECRET: ${BROWSER_SECRET:-}
    networks:
      - browser-link
      - browser-egress
    init: true
    restart: unless-stopped
    shm_size: 256mb
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: opendots
      POSTGRES_DB: opendots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - opendots-pg:/var/lib/postgresql/data
    networks:
      - data-link
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  docling:
    build:
      context: .
      target: docling
    environment:
      DOCLING_SERVE_ENABLE_UI: 'false'
      # Seconds; one document that takes longer is marked failed.
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: ${DOCLING_MAX_DOCUMENT_TIMEOUT:-900}
    networks:
      - data-link
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
networks:
  browser-link:
    internal: true
  data-link:
    internal: true
  app-egress:
  browser-egress:
volumes:
  opendots-data:
  opendots-pg:
