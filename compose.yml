services:
  app:
    build:
      context: .
      target: app
    ports:
      - '127.0.0.1:4310:4310'
    environment:
      OWNER_TOKEN: ${OWNER_TOKEN:?Set a 24+ character OWNER_TOKEN in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4310}
      OWNER_ID: ${OWNER_ID:-opendots-owner}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-live}
      VOICE_MODEL: ${VOICE_MODEL:-}
      VOICE_NAME: ${VOICE_NAME:-marin}
      VOICE_TASK_MODEL: ${VOICE_TASK_MODEL:-}
      VOICE_TASK_LIMIT: ${VOICE_TASK_LIMIT:-}
      VOICE_TRANSCRIBE_MODEL: ${VOICE_TRANSCRIBE_MODEL:-}
      VOICE_SPEECH_MODEL: ${VOICE_SPEECH_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-sol}
      OPENAI_API: ${OPENAI_API:-responses}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gpt-5.4-mini}
      FAST_MODEL: ${FAST_MODEL:-gpt-6-luna}
      DECISIONS_MODEL: ${DECISIONS_MODEL:-gpt-6-luna}
      TASK_SPLIT: ${TASK_SPLIT:-}
      CONTEXT_MAX_TOKENS: ${CONTEXT_MAX_TOKENS:-}
      MAX_AGENT_TURNS: ${MAX_AGENT_TURNS:-}
      LAZY_TOOLS: ${LAZY_TOOLS:-}
      LOG_CONTEXT_SIZE: ${LOG_CONTEXT_SIZE:-}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-parallel}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      BROWSER_URL: http://browser:4311
      BROWSER_SECRET: ${BROWSER_SECRET:-}
      DATABASE_URL: postgres://opendots:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/opendots
      DOCLING_URL: http://docling:5001
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      MEMORY_MODEL: ${MEMORY_MODEL:-gpt-5.4-mini}
      ENRICHMENT_MODEL: ${ENRICHMENT_MODEL:-gpt-5.4-mini}
      RERANK_MODEL: ${RERANK_MODEL:-gpt-5.4-mini}
      DOCUMENTS_DIR: /data/documents
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
      PLUGIN_SECRET_KEY: ${PLUGIN_SECRET_KEY:-}
    volumes:
      - opendots-data:/data
    depends_on:
      - postgres
      - docling
    networks:
      - browser-link
      - data-link
      - app-egress
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  browser:
    profiles: [browser]
    build:
      context: .
      target: browser
    environment:
      BROWSER_SECRET: ${BROWSER_SECRET:-}
    networks:
      - browser-link
      - browser-egress
    init: true
    restart: unless-stopped
    shm_size: 256mb
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: opendots
      POSTGRES_DB: opendots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - opendots-pg:/var/lib/postgresql/data
    networks:
      - data-link
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  docling:
    build:
      context: .
      target: docling
    environment:
      DOCLING_SERVE_ENABLE_UI: 'false'
      # Seconds; one document that takes longer is marked failed.
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: ${DOCLING_MAX_DOCUMENT_TIMEOUT:-900}
    networks:
      - data-link
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
networks:
  browser-link:
    internal: true
  data-link:
    internal: true
  app-egress:
  browser-egress:
volumes:
  opendots-data:
  opendots-pg:
